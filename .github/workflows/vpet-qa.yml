name: VPET QA

on:
  push:
    branches: [vpet-home-immersiva]
  pull_request:

jobs:
  user-journey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "VPET_CON_GUIDA_E_VIDEO (1)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "VPET_CON_GUIDA_E_VIDEO (1)/package-lock.json"
      - run: npm install
      - run: npm run build
      - run: npm run qa:content
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:e2e
